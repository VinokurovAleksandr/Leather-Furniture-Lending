<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Document</title>
</head>
<body>
  <header class="header">
  <div class="header__banner">Limited time offer: Get 20% off</div>
  <div class="header__container">
    <nav class="header__nav">
      <a class="header__logo" href="#">
        <img src="./img/header/logo.svg" alt="logo">
      </a>

      <ul class="header__list">
        <li class="header__item">
          <a class="header__link" href="#">
            <img class="header__link-icon" src="./img/header/home.svg" alt="">
            <span>Home</span>
          </a>
        </li>
        <li class="header__item">
          <a class="header__link" href="#">
            <img class="header__link-icon" src="./img/header/bags.svg" alt="">
            <span>Bags</span>
          </a>
        </li>
        <li class="header__item">
          <a class="header__link" href="#">
            <img class="header__link-icon" src="./img/header/garments.svg" alt="">
            <span>Garments</span>
          </a>
        </li>
        <li class="header__item">
          <a class="header__link" href="#">
            <img class="header__link-icon" src="./img/header/furniture.svg" alt="">
            <span>Furniture</span>
          </a>
        </li>
        <li class="header__item">
          <a class="header__link" href="#">
            <img class="header__link-icon" src="./img/header/goods.svg" alt="">
            <span>Goods</span>
          </a>
        </li>
        <li class="header__item">
          <a class="header__link" href="#">
            <img class="header__link-icon" src="./img/header/more.svg" alt="">
            <span>More</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="hero section">
    <div class="hero__container">
      
      <div class="hero__badge-wrapper">
        <div class="hero__badge">
          <img class="hero__badge-icon" src="./img/main/star.svg" alt="">
          <span class="hero__badge-text">4.8 star-rated service</span>
        </div>
      </div>

      <h1 class="hero__title">Leather Furniture Repair in Austin since 2015</h1>
      <p class="hero__subtitle">We breathe new life into your leather goods.</p>

      <form class="hero__form zip-form">
        <input class="zip-form__input" type="text" placeholder="Enter your ZIP">
        <button class="zip-form__btn" type="button">CHECK AREA</button>
      </form>

      <ul class="hero__perks">
        <li class="hero__perk">
          <img src="./img/main/delivery.svg" alt="">
          <span>Free pickup & delivery</span>
        </li>
        <li class="hero__perk">
          <img src="./img/main/gifts.svg" alt="">
          <span>Save up to 20% today</span>
        </li>
      </ul>

      <div class="hero__social-proof">
        <div class="hero__avatars">
          <img src="./img/main/ellopse1.png" alt="">
          <img src="./img/main/ellopse2.png" alt="">
          <img src="./img/main/ellopse3.jpg" alt="">
        </div>
        <p class="hero__social-text">
          <strong>1500+</strong> Satisfied customers
        </p>
      </div>

    </div>
  </section>
</main>
</body>
</html>
